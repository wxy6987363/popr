name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: popr-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: popr-linux-aarch64
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            name: popr-windows-x86_64.exe
            ext: .exe
          - target: x86_64-apple-darwin
            os: macos-latest
            name: popr-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: popr-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install mingw
        if: contains(matrix.target, 'windows')
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure linker
        shell: bash
        run: |
          mkdir -p .cargo
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              printf '[target.x86_64-unknown-linux-musl]\nlinker = "musl-gcc"\n' >> .cargo/config.toml
              ;;
            aarch64-unknown-linux-gnu)
              printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml
              ;;
            x86_64-pc-windows-gnu)
              printf '[target.x86_64-pc-windows-gnu]\nlinker = "x86_64-w64-mingw32-gcc"\n' >> .cargo/config.toml
              ;;
          esac
          echo "--- .cargo/config.toml ---"
          cat .cargo/config.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/popr${{ matrix.ext }}" "${{ matrix.name }}"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
