name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: popr-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: popr-linux-aarch64
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            name: popr-windows-x86_64.exe
            ext: .exe
          - target: x86_64-apple-darwin
            os: macos-latest
            name: popr-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: popr-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install mingw
        if: contains(matrix.target, 'windows')
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure linker
        shell: bash
        run: |
          mkdir -p .cargo
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              printf '[target.x86_64-unknown-linux-musl]\nlinker = "musl-gcc"\n' >> .cargo/config.toml
              ;;
            aarch64-unknown-linux-gnu)
              printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml
              ;;
            x86_64-pc-windows-gnu)
              printf '[target.x86_64-pc-windows-gnu]\nlinker = "x86_64-w64-mingw32-gcc"\n' >> .cargo/config.toml
              ;;
            *)
              echo "no linker override for ${{ matrix.target }}"
              ;;
          esac
          if [ -f .cargo/config.toml ]; then
            cat .cargo/config.toml
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/popr${{ matrix.ext }}" "${{ matrix.name }}"

      - name: Upload binary
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}

  upload-scripts:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload install scripts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            install.sh
            install.ps1

  source-tarball:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source tarball
        run: |
          NAME="popr-${GITHUB_REF_NAME}-src.tar.bz2"
          ROOT="popr-${GITHUB_REF_NAME}"

          # 用一个临时目录包一层顶层目录
          mkdir -p "pkg/${ROOT}"

          # 复制源码（排除不需要的）
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='target' \
            --exclude='*.tar.bz2' \
            ./ "pkg/${ROOT}/"

          # 打包
          cd pkg
          tar -cjf "../${NAME}" "${ROOT}"
          cd ..

          mv "${NAME}" .

          ls -lh "${NAME}"

      - name: Upload source tarball
        uses: softprops/action-gh-release@v2
        with:
          files: popr-*-src.tar.bz2
